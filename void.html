<!DOCTYPE html>
<html>
<head>
  <title>The Void</title>
  <style>
    body {
      margin:0;
      background:black;
      color:#0f0;
      font-family:'Courier New', monospace;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      flex-direction:column;
      height:100vh;
      cursor:default;
    }

    #voidText {
      font-size:32px;
      text-align:center;
      position:relative;
      z-index:1;
      margin-top:20px;
    }

    .glitch {
      position:absolute;
      color:#0ff;
      font-size:32px;
      user-select:none;
      pointer-events:none; /* allow input clicks through glitches */
    }

    #chatWindow {
      position:relative;
      z-index:9999;
      width:400px;
      height:250px;
      overflow-y:auto;
      background:black;
      color:#0f0;
      border:1px solid #0f0;
      padding:10px;
      font-family:'Courier New', monospace;
      margin-top:20px;
    }

    #chatInput {
      position:relative;
      z-index:10000;
      width:400px;
      background:black;
      color:#0f0;
      border:1px solid #0f0;
      padding:5px;
      font-family:'Courier New', monospace;
      margin-top:5px;
      cursor:text;
    }

    .chatImage {
      width:100%;
      margin:5px 0;
      border:1px solid #0f0;
    }
  </style>
</head>
<body>

<div id="voidText">YOU SHOULD NOT BE HERE</div>

<div id="chatWindow"></div>
<input id="chatInput" type="text" placeholder="type a message..." autofocus>

<audio id="glitchAudio" src="glitch_hum.mp3" autoplay loop></audio>
<audio id="beepAudio" src="beep.wav"></audio>
<audio id="secretAudio" src="secret_sound.mp3"></audio>
<audio id="song1" src="song1.mp3"></audio>

<script>
const voidText = document.getElementById('voidText');
const chatWindow = document.getElementById('chatWindow');
const chatInput = document.getElementById('chatInput');
const beepAudio = document.getElementById('beepAudio');
const secretAudio = document.getElementById('secretAudio');
const song1 = document.getElementById('song1');

// --- Random cursor flicker ---
let cursorVisible = true;
setInterval(()=>{
  cursorVisible = !cursorVisible;
  chatInput.style.caretColor = cursorVisible ? '#0f0' : '#0ff';
}, 400 + Math.random()*400);

// --- Random beeps ---
setInterval(()=>{
  if(Math.random()<0.1) beepAudio.play();
},700);

// --- Floating corrupted letters ---
setInterval(()=>{
  const glitch = document.createElement('div');
  glitch.className='glitch';
  glitch.innerText = String.fromCharCode(33 + Math.floor(Math.random()*94));
  glitch.style.top = Math.random()*window.innerHeight+'px';
  glitch.style.left = Math.random()*window.innerWidth+'px';
  glitch.style.fontSize = 20 + Math.random()*30 + 'px';
  document.body.appendChild(glitch);
  setTimeout(()=>glitch.remove(),1500);
},100);

// --- Stack numbers / shapes for clues ---
function stackShape(str,x,y,color="#0f0"){
  for(let i=0;i<str.length;i++){
    const g=document.createElement('div');
    g.className='glitch';
    g.innerText=str[i];
    g.style.top = y + i*20 + 'px';
    g.style.left = x + 'px';
    g.style.color = color;
    document.body.appendChild(g);
    setTimeout(()=>g.remove(),5000);
  }
}
setInterval(()=>{
  if(Math.random()<0.05){
    stackShape(Math.floor(Math.random()*1000).toString(), Math.random()*window.innerWidth, Math.random()*window.innerHeight);
  }
},1500);

// --- Flicker main void text ---
setInterval(()=>{
  voidText.style.color = Math.random()>0.5?'#0f0':'#0ff';
  voidText.style.transform = `translate(${Math.random()*6-3}px,${Math.random()*6-3}px)`;
},100);

// --- Chatbot ---
const responses = {
  hello: "Hello, wanderer... How did you find me?",
  wake: "im up bruh...",
  help: "There is no help here. Only questions.",
  reveal: "i added a cat, hope she doesnt scare you to much...",
  glitch: "You feel the void glitch around you.",
  chatlog: "You see old conversations...",
  default: "I do not understand...",
  Ass: "what the fuck man",
  why: "I dont really know...",
  Pineapple: "pen pineapple apple pen. mhm. do you remember?",
  Apple: "pen pineapple apple pen. mhm. do you remember?", 
  worm: "worm",
  Katstands: "GO TO KATSTANDS.COM GOATED OMG", 
  cokeillennials: "Cocaine first found its uses as a topical anisthetic. Surgeons in the late to early 19th and 20th centuries began experimenting with cocaine by sprinkling it into their eyes and poking at them with syringes and scalpels. Cocaine quickly spread into medicine as a cure-all, and even found its way into cola. The widespread public usage of cocaine led to many children to be born disformed, and because of the era's primitave medicine, many died.The babies who did survive often had excelerated IQs, although this trend would not be discovered until the 1990s.",
  break: "shit okay" 
  Kat: "hi guys :333 i love you !!!!",
  
};

chatInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const message = e.target.value.trim();
    if(!message) return;
    chatWindow.innerHTML += `<p style="color:#0ff;">> ${message}</p>`;

    let reply = responses.default;
    for(let key in responses){
      if(message.toLowerCase().includes(key)){
        reply = responses[key];
        break;
      }
    }

    chatWindow.innerHTML += `<p>${reply}</p>`;
    chatWindow.scrollTop = chatWindow.scrollHeight;
    e.target.value='';

    // Special effects for some commands
    if(message.toLowerCase().includes('reveal')){
      document.body.style.background = 'url("bliss2.jpg") no-repeat center center fixed';
      document.body.style.backgroundSize = 'cover';
      secretAudio.play();
    }
    if(message.toLowerCase().includes('glitch')){
      for(let i=0;i<20;i++){
        const g=document.createElement('div');
        g.className='glitch';
        g.innerText=String.fromCharCode(33+Math.floor(Math.random()*94));
        g.style.top=Math.random()*window.innerHeight+'px';
        g.style.left=Math.random()*window.innerWidth+'px';
        g.style.fontSize=15+Math.random()*25+'px';
        document.body.appendChild(g);
        setTimeout(()=>g.remove(),3000);
      }
    }
    if(message.toLowerCase().includes('chatlog')){
      // Display old chat log images
      const img1 = document.createElement('img');
      img1.src = 'chat1.png';
      img1.className = 'chatImage';
      chatWindow.appendChild(img1);

      const img2 = document.createElement('img');
      img2.src = 'chat2.png';
      img2.className = 'chatImage';
      chatWindow.appendChild(img2);
    }
    if(message.toLowerCase().includes('gorillaz')){
      song1.play();
    }
  }
});
</script>

</body>
</html>
