<!DOCTYPE html>
<html>
<head>
<title>ash_desktop</title>

<style>
body{
margin:0;
font-family:"Cholla",sans-serif;
overflow:hidden;
background:url('bliss.jpg') no-repeat center center fixed;
background-size:cover;
}

/* CRT Scanlines */
.scanlines{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
background:repeating-linear-gradient(
to bottom,
rgba(0,0,0,0.08) 0px,
rgba(0,0,0,0.08) 2px,
transparent 2px,
transparent 4px
);
z-index:999;
}

/* Windows */
.window{
position:absolute;
width:420px;
background:#c0c0c0;
border:2px solid black;
display:none;
box-shadow:4px 4px 0 #000;
}

.titlebar{
background:linear-gradient(to right,#000080,#1084d0);
color:white;
padding:4px;
font-size:14px;
cursor:move;
display:flex;
justify-content:space-between;
}

.content{
padding:15px;
font-size:14px;
}

/* Desktop */
.desktop{
display:flex;
flex-direction:column;
width:100px;
padding:10px;
position:absolute;
top:10px;
left:10px;
}

.icon{
width:80px;
text-align:center;
color:white;
cursor:pointer;
margin:15px 0;
}

.icon img{
width:48px;
image-rendering:pixelated;
}

.icon:hover{
opacity:0.8;
}

/* My Documents */
#docsContent{
display:grid;
grid-template-columns:repeat(auto-fill,90px);
gap:15px;
}

.file{
text-align:center;
cursor:pointer;
font-size:12px;
}

.file img{
display:block;
margin:auto;
width:60px;
image-rendering:pixelated;
}

.file:hover{
background:rgba(255,255,255,0.2);
}

/* Taskbar */
.taskbar{
position:fixed;
bottom:0;
width:100%;
height:40px;
background:#c0c0c0;
border-top:2px solid #000;
display:flex;
align-items:center;
}

.start{
background:#c0c0c0;
border:2px solid black;
margin:5px;
padding:5px 10px;
font-weight:bold;
cursor:pointer;
}

.clock{
margin-left:auto;
margin-right:10px;
cursor:pointer;
}

/* Secret Page */
#secretPage{
position:fixed;
width:100%;
height:100%;
background:black;
color:#0f0;
display:none;
justify-content:center;
align-items:center;
font-family:'Courier New',monospace;
text-align:center;
z-index:20000;
flex-direction:column;
}

#secretPage input{
margin-top:20px;
background:black;
color:#0f0;
border:1px solid #0f0;
padding:5px;
}

/* Boot */
#bootScreen{
position:fixed;
width:100%;
height:100%;
background:black;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-family:Tahoma;
font-size:20px;
z-index:5000;
}

/* Mini Browser ARG Style */
#mini-browser{
width:450px;
height:550px;
border:2px solid #333;
border-radius:12px;
overflow:hidden;
display:flex;
flex-direction:column;
font-family: 'Segoe UI', sans-serif;
background:#111;
position:absolute;
display:none; /* initially hidden until opened */
}

#mini-browser .top-bar{
display:flex;
align-items:center;
padding:5px;
background:#222;
color:#fff;
}

#mini-browser .top-bar input{
flex:1;
padding:5px;
border-radius:5px;
border:none;
background:#111;
color:#0f0;
font-weight:bold;
letter-spacing:0.5px;
}

#mini-browser .top-bar button{
margin-left:5px;
padding:5px 10px;
border-radius:5px;
border:none;
background:#555;
color:white;
}

/* Loading bar */
#mini-browser #loading-bar{
height:3px;
background:#0f0;
width:0%;
transition: width 0.2s;
}

</style>
</head>

<body>

<div id="bootScreen">
<p>Starting Windows 98...</p>
</div>

<!-- Desktop Icons -->
<div class="desktop">

<div class="icon" onclick="openWindow('popup')">
<img src="computer.png">
<div>OK Computer</div>
</div>

<div class="icon" onclick="openWindow('docsWindow')">
<img src="folder.png">
<div> Documents</div>
</div>

<div class="icon" onclick="openWindow('musicWindow')">
<img src="music.png">
<div>Music </div>
</div>

<div class="icon" onclick="openWindow('crossyWindow')">
<img src="game.png">
<div>Crossy Road 2.0</div>
</div>

<div class="icon" onclick="openWindow('mini-browser')">
<img src="browser.png">
<div>Mini Browser</div>
</div>

</div>

<!-- Mini Browser -->
<div class="window" id="mini-browser">
  <div class="top-bar">
    <button onclick="goBack()">◀</button>
    <button onclick="goForward()">▶</button>
    <button onclick="reloadPage()">⟳</button>
    <input id="url-input" type="text" placeholder="Enter URL...">
    <button onclick="loadURL()">Go</button>
  </div>
  <div id="loading-bar"></div>
  <iframe id="browser-frame" src="https://example.com" style="flex:1;border:none;"></iframe>
</div>

<!-- System Popup -->
<div class="window" id="popup">
<div class="titlebar">System<div><button onclick="closeWindow('popup')">X</button></div></div>
<div class="content">
<p>get out of my damn computer</p>
<p>Status: online</p>
</div>
</div>

<!-- Documents -->
<div class="window" id="docsWindow">
<div class="titlebar">My Documents<div><button onclick="closeWindow('docsWindow')">X</button></div></div>
<div class="content" id="docsContent">
<!-- files as before -->
</div>
</div>

<!-- File Viewer -->
<div class="window" id="fileViewer">
<div class="titlebar">Viewer<div><button onclick="closeWindow('fileViewer')">X</button></div></div>
<div class="content" id="fileContent"></div>
</div>

<!-- Music Player -->
<div class="window" id="musicWindow">
<div class="titlebar">Music Player<div><button onclick="closeWindow('musicWindow')">X</button></div></div>
<div class="content" style="display:flex;flex-direction:column;align-items:center;">
<p id="currentTrack"><b>Track: None</b></p>
<audio id="audioPlayer" controls style="width:90%;"></audio>

<div style="margin-top:10px;">
<button onclick="prevTrack()">⏮️</button>
<button onclick="playPause()">▶️/⏸️</button>
<button onclick="nextTrack()">⏭️</button>
</div>
</div>
</div>

<!-- CROSSY ROAD GAME -->
<div class="window" id="crossyWindow">
<div class="titlebar">Frogger.exe<div><button onclick="closeWindow('crossyWindow')">X</button></div></div>
<div class="content" style="text-align:center">
<canvas id="gameCanvas" width="380" height="300" style="border:2px solid black"></canvas>
<p style="font-size:12px">Use arrow keys to cross the road</p>
</div>
</div>

<!-- Secret Page -->
<div id="secretPage">
<p id="secretText">You're not supposed to be here yet.</p>
<input id="secretInput" type="text" placeholder="Type secret here">
</div>

<!-- Taskbar -->
<div class="taskbar">
<div class="start" onclick="shutdown()">Shut Down</div>
<div class="clock" id="clock"></div>
</div>

<div class="scanlines"></div>

<script>
/* BOOT */
window.addEventListener('load',()=>{
setTimeout(()=>{
document.getElementById('bootScreen').style.display="none";
},3000);
});

/* WINDOWS */
let zIndexCounter=1;
function openWindow(id){
const win=document.getElementById(id);
win.style.display="block";
win.style.zIndex=zIndexCounter++;
win.style.left=(100+Math.random()*300)+"px";
win.style.top=(60+Math.random()*200)+"px";
}
function closeWindow(id){document.getElementById(id).style.display="none";}

/* CLOCK */
function updateClock(){
const now=new Date();
document.getElementById("clock").innerText=
now.getHours()+":"+
String(now.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000);
updateClock();

/* DRAG WINDOWS */
let dragTarget=null,offsetX=0,offsetY=0;
document.addEventListener('mousedown',e=>{
if(e.target.closest('.titlebar')){
dragTarget=e.target.closest('.window');
offsetX=e.clientX-dragTarget.offsetLeft;
offsetY=e.clientY-dragTarget.offsetTop;
dragTarget.style.zIndex=zIndexCounter++;
}
});
document.addEventListener('mousemove',e=>{
if(dragTarget){
dragTarget.style.left=(e.clientX-offsetX)+'px';
dragTarget.style.top=(e.clientY-offsetY)+'px';
}
});
document.addEventListener('mouseup',()=>{dragTarget=null;});

/* MINI BROWSER ARG CODE */
let historyStack = [];
let historyIndex = -1;
const iframe = document.getElementById('browser-frame');
const urlInput = document.getElementById('url-input');
const loadingBar = document.getElementById('loading-bar');

function loadURL(url = null){
  let targetURL = url || urlInput.value;
  if(!/^https?:\/\//i.test(targetURL)) targetURL='https://'+targetURL;
  iframe.src = targetURL;
  if(!url) pushHistory(targetURL);
  startLoading();
  glitchURL(targetURL);
}

function pushHistory(url){
  historyStack=historyStack.slice(0,historyIndex+1);
  historyStack.push(url);
  historyIndex++;
}

function goBack(){if(historyIndex>0){historyIndex--;loadURL(historyStack[historyIndex]);}}
function goForward(){if(historyIndex<historyStack.length-1){historyIndex++;loadURL(historyStack[historyIndex]);}}
function reloadPage(){loadURL(historyStack[historyIndex]);}

function startLoading(){
  loadingBar.style.background=getRandomColor();
  loadingBar.style.width='0%';
  setTimeout(()=>loadingBar.style.width='100%',50);
  setTimeout(()=>loadingBar.style.width='0%',500);
}

function getRandomColor(){
  const colors=['#0f0','#0ff','#f0f','#ff0','#f00'];
  return colors[Math.floor(Math.random()*colors.length)];
}

function glitchURL(finalURL){
  let glitchIterations=10;
  let count=0;
  const originalValue=finalURL;
  const glitchInterval=setInterval(()=>{
    let randomStr = originalValue.split('').map(c=>Math.random()>0.3?c:getRandomChar()).join('');
    urlInput.value=randomStr;
    count++;
    if(count>=glitchIterations){urlInput.value=originalValue;clearInterval(glitchInterval);}
  },50);
}

function getRandomChar(){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!?@#$%^&*';return chars[Math.floor(Math.random()*chars.length)];}

</script>

</body>
</html>
