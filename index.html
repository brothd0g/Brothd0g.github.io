<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Desktop ARG - CRT Version</title>
<style>
body {
  margin: 0;
  font-family: "Tahoma", sans-serif;
  overflow: hidden;
  background: #000;
}

/* CRT screen wrapper */
#crtScreen {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  border-radius: 8px; /* slight curvature */
  box-shadow: inset 0 0 100px rgba(0,0,0,0.2); /* vignette */
}

/* Stronger scanlines */
.scanlines {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.12) 0px,
    rgba(0,0,0,0.12) 1px,
    transparent 1px,
    transparent 2px
  );
  z-index: 999;
}

/* Flicker overlay */
.flicker {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background: rgba(255,255,255,0.02);
  pointer-events: none;
  z-index: 10000;
  animation: flickerAnim 0.1s infinite;
}
@keyframes flickerAnim {
  0% { opacity: 0.02; }
  50% { opacity: 0.05; }
  100% { opacity: 0.02; }
}

/* Desktop icons */
.desktop {
  display: flex;
  flex-direction: column;
  width: 100px;
  padding: 10px;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1;
}
.icon {
  width: 80px;
  text-align: center;
  color: white;
  cursor: pointer;
  margin: 15px 0;
}
.icon img {
  width: 48px;
  image-rendering: pixelated;
}

/* Windows */
.window {
  position: absolute;
  width: 400px;
  background: #c0c0c0;
  border: 2px solid black;
  display: none;
  box-shadow: 4px 4px 0 #000;
}
.titlebar {
  background: linear-gradient(to right, #000080, #1084d0);
  color: white;
  padding: 4px;
  font-size: 14px;
  cursor: move;
  display: flex;
  justify-content: space-between;
}
.window button {
  margin-left: 5px;
  background: #c0c0c0;
  border: 1px solid black;
  cursor: pointer;
}
.content {
  padding: 15px;
  font-size: 14px;
}

/* Taskbar */
.taskbar {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 40px;
  background: #c0c0c0;
  border-top: 2px solid #000;
  display: flex;
  align-items: center;
  z-index: 1000;
}
.start {
  background: #c0c0c0;
  border: 2px solid black;
  margin: 5px;
  padding: 5px 10px;
  font-weight: bold;
  cursor: pointer;
  z-index: 1001;
}
.clock {
  margin-left: auto;
  margin-right: 10px;
  font-size: 14px;
}

/* Wired Window */
#wiredWindow {
  background: #111;
  color: #0f0;
  border: 2px solid #0f0;
}
#wiredWindow .titlebar { background: linear-gradient(to right,#200,#900); }

/* Music Player Window */
#musicWindow {
  background: #222;
  color: #0f0;
  border: 2px solid #0f0;
  font-family: "Courier New", monospace;
}
#musicWindow button {
  background: #555;
  color: white;
  border: 1px solid #0f0;
}

/* Shed Album */
#shedAlbum {
  background: #222;
  color: #0f0;
  border: 2px solid #0f0;
  font-family: "Courier New", monospace;
  text-align: center;
  transition: opacity 0.1s;
}
#shedAlbum img {
  width: 200px;
  margin-bottom: 10px;
  animation: pulse 2s infinite;
  border: 2px solid #0f0;
  box-shadow: 0 0 10px #0f0;
}
@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 10px #0f0; }
  50% { transform: scale(1.05); box-shadow: 0 0 20px #0f0; }
  100% { transform: scale(1); box-shadow: 0 0 10px #0f0; }
}
#shedTracklist { list-style:none; padding:0; }
#shedTracklist li { margin:5px 0; cursor:pointer; transition: color 0.2s, transform 0.2s; }
#shedTracklist li:hover { color: #ff0; transform: scale(1.05); }
#shedTracklist li.current { color: #0ff; font-weight:bold; }

/* Secret Page */
#secretPage {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  color: #0f0;
  display: none;
  justify-content: center;
  align-items: center;
  font-family: 'Courier New', monospace;
  font-size: 36px;
  text-align: center;
  z-index: 20000;
  overflow: hidden;
}

/* Shutdown Screen */
#shutdownScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  color: white;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-direction: column;
  z-index: 10000;
}
#powerOn {
  background: red;
  border: none;
  padding: 10px 20px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}

/* Hidden ARG file */
#hiddenFile { display:none; margin-top:10px; cursor:pointer; color:#0f0; text-decoration: underline; }

</style>
</head>
<body>

<div id="crtScreen">
  <div class="desktop">
    <div class="icon" id="iconMyComputer" onclick="openWindow('popup')">
      <img src="computer.png"><div>My Computer</div>
    </div>
    <div class="icon" onclick="openWindow('docsWindow')">

    </div>
    <div class="icon" id="iconWired" onclick="openWindow('wiredWindow')">
      <img src="wired.png"><div>The Wired</div>
    </div>
    <div class="icon" onclick="openWindow('musicWindow')">
      <img src="music.png"><div>Music Player</div>
    </div>
    <div class="icon" id="iconShed" onclick="openWindow('shedAlbum')">
      <img src="shed_icon.png"><div>Shed Album</div>
    </div>
  </div>

  <!-- Windows (popup, docsWindow, wiredWindow, musicWindow, shedAlbum, secretARG, secretPage, shutdownScreen) -->

  <div class="taskbar">
    <div class="start" onclick="shutdown()">Shut Down</div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="scanlines"></div>
  <div class="flicker"></div>
</div>

<audio id="startupSound" src="startup.wav"></audio>
<audio id="shedPlayer"></audio>
<audio id="audioPlayer" controls style="display:none;"></audio>

</body>
</html>
