<!DOCTYPE html>
<html>
<head>
    <title>ash_desktop</title>
    <style>
        body {
            margin: 0;
            background: #008080;
            font-family: "Tahoma", sans-serif;
            overflow: hidden;
        }

        /* CRT Scanlines */
        .scanlines {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0,0,0,0.03) 0px,
                rgba(0,0,0,0.03) 1px,
                transparent 2px,
                transparent 4px
            );
        }

        /* Desktop Icons */
        .desktop {
            display: flex;
            flex-direction: column;
            width: 100px;
            padding: 10px;
        }

        .icon {
            width: 80px;
            text-align: center;
            color: white;
            cursor: pointer;
            margin: 15px 0;
        }

        .icon img {
            width: 48px;
            image-rendering: pixelated;
        }

        /* Windows */
        .window {
            position: absolute;
            top: 120px;
            left: 200px;
            width: 400px;
            background: #c0c0c0;
            border: 2px solid black;
            display: none;
            box-shadow: 4px 4px 0 #000;
        }

        .titlebar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 4px;
            font-size: 14px;
            cursor: move;
            display: flex;
            justify-content: space-between;
        }

        .window button {
            margin-left: 5px;
            background: #c0c0c0;
            border: 1px solid black;
            cursor: pointer;
        }

        .content {
            padding: 15px;
            font-size: 14px;
        }

        /* Taskbar */
        .taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: #c0c0c0;
            border-top: 2px solid #000;
            display: flex;
            align-items: center;
        }

        .start {
            background: #c0c0c0;
            border: 2px solid black;
            margin: 5px;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .clock {
            margin-left: auto;
            margin-right: 10px;
            font-size: 14px;
        }

        /* Wired Window */
        #wiredWindow {
            background: #111;
            color: #0f0;
            border: 2px solid #0f0;
            top: 150px;
            left: 250px;
        }

        #wiredWindow .titlebar {
            background: linear-gradient(to right,#200,#900);
        }

        /* Shutdown Screen */
        #shutdownScreen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-direction: column;
        }

        #powerOn {
            background: red;
            border: none;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="desktop">

    <div class="icon" onclick="openWindow('popup')">
        <img src="computer.png">
        <div>My Computer</div>
    </div>

    <div class="icon" onclick="openWindow('docsWindow')">
        <img src="folder.png">
        <div>My Documents</div>
    </div>

    <div class="icon" onclick="openWindow('wiredWindow')">
        <img src="wired.png">
        <div>The Wired</div>
    </div>

</div>

<!-- Normal Window -->
<div class="window" id="popup">
    <div class="titlebar">
        System
        <div>
            <button onclick="minimize('popup')">_</button>
            <button onclick="closeWindow('popup')">X</button>
        </div>
    </div>
    <div class="content">
        <p>Welcome to my digital room.</p>
        <p>Status: online</p>
    </div>
</div>

<!-- Docs Window -->
<div class="window" id="docsWindow">
    <div class="titlebar">
        My Documents
        <div>
            <button onclick="minimize('docsWindow')">_</button>
            <button onclick="closeWindow('docsWindow')">X</button>
        </div>
    </div>
    <div class="content">
        <p>Nothing to see here... yet.</p>
    </div>
</div>

<!-- Wired Window -->
<div class="window" id="wiredWindow">
    <div class="titlebar">
        wired_connection.exe
        <div>
            <button onclick="minimize('wiredWindow')">_</button>
            <button onclick="closeWindow('wiredWindow')">X</button>
        </div>
    </div>
    <div class="content">
        <p id="glitch">connection unstable...</p>
        <p>you are already here.</p>
        <p style="opacity:0.6;">there is no outside.</p>
        <br>
        <button onclick="closeWindow('wiredWindow')">disconnect</button>
    </div>
</div>

<!-- Shutdown Screen -->
<div id="shutdownScreen">
    <p>It is now safe to turn off your computer.</p>
    <button id="powerOn" onclick="powerOn()">POWER ON</button>
</div>

<div class="taskbar">
    <div class="start" onclick="shutdown()">Shut Down</div>
    <div class="clock" id="clock"></div>
</div>

<div class="scanlines"></div>

<script>
let zIndexCounter = 1;

function openWindow(id) {
    const win = document.getElementById(id);
    win.style.display = "block";
    win.style.zIndex = zIndexCounter++;
}

// Minimize
function minimize(id) {
    const win = document.getElementById(id);
    win.style.display = "none";
}

// Close
function closeWindow(id) {
    const win = document.getElementById(id);
    win.style.display = "none";
}

// Shutdown
function shutdown() {
    document.body.innerHTML = '';
    document.body.appendChild(document.getElementById('shutdownScreen'));
    document.getElementById('shutdownScreen').style.display = "flex";
}

// Power on
function powerOn() {
    location.reload();
}

// Clock
function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
        now.getHours() + ":" +
        String(now.getMinutes()).padStart(2, '0');
}
setInterval(updateClock, 1000);
updateClock();

// Wired window glitch
setInterval(() => {
    const text = document.getElementById("glitch");
    if (text) text.style.opacity = Math.random();
}, 150);

// Draggable windows
let dragTarget = null;
let offsetX = 0;
let offsetY = 0;

document.addEventListener('mousedown', (e) => {
    if (e.target.closest('.titlebar')) {
        dragTarget = e.target.closest('.window');
        offsetX = e.clientX - dragTarget.offsetLeft;
        offsetY = e.clientY - dragTarget.offsetTop;
        dragTarget.style.zIndex = zIndexCounter++;
    }
});

document.addEventListener('mousemove', (e) => {
    if (dragTarget) {
        dragTarget.style.left = (e.clientX - offsetX) + 'px';
        dragTarget.style.top = (e.clientY - offsetY) + 'px';
    }
});

document.addEventListener('mouseup', () => {
    dragTarget = null;
});
</script>

</body>
</html>
