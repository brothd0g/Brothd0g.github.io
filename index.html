<!DOCTYPE html>
<html>
<head>
    <title>Desktop</title>

    <style>
        body {
            margin: 0;
            background: #008080;
            font-family: "Tahoma", sans-serif;
            overflow: hidden;
        }

        /* Desktop Icons */
        .icon {
            width: 80px;
            text-align: center;
            color: white;
            cursor: pointer;
            margin: 20px;
        }

        .icon img {
            width: 48px;
            image-rendering: pixelated;
        }

        .desktop {
            display: flex;
            flex-direction: column;
            width: 100px;
        }

        /* Window */
        .window {
            position: absolute;
            top: 120px;
            left: 200px;
            width: 400px;
            background: #c0c0c0;
            border: 2px solid black;
            display: none;
        }

        .titlebar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 4px;
            font-size: 14px;
        }

        .content {
            padding: 15px;
            font-size: 14px;
        }

        /* Taskbar */
        .taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: #c0c0c0;
            border-top: 2px solid #000;
            display: flex;
            align-items: center;
        }

        .start {
            background: #c0c0c0;
            border: 2px solid black;
            margin: 5px;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .clock {
            margin-left: auto;
            margin-right: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="desktop">
    <div class="icon" onclick="openWindow()">
        <img src="computer.png">
        <div>My Computer</div>
    </div>

    <div class="icon" onclick="openWindow()">
        <img src="folder.png">
        <div>My Documents</div>
    </div>
</div>

<div class="window" id="popup">
    <div class="titlebar">System</div>
    <div class="content">
        <p>my digital space.</p>
        <p>Status: connected</p>
    </div>
</div>

<div class="taskbar">
    <div class="start">Start</div>
    <div class="clock" id="clock"></div>
</div>

<script>
function openWindow() {
    document.getElementById("popup").style.display = "block";
}

function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
        now.getHours() + ":" +
        String(now.getMinutes()).padStart(2, '0');
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
