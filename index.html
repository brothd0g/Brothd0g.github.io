<!DOCTYPE html>
<html>
<head>
    <title>ash_desktop</title>

    <style>
        body {
            margin: 0;
            background: #008080;
            font-family: "Tahoma", sans-serif;
            overflow: hidden;
        }

        .desktop {
            display: flex;
            flex-direction: column;
            width: 100px;
            padding: 10px;
        }

        .icon {
            width: 80px;
            text-align: center;
            color: white;
            cursor: pointer;
            margin: 15px 0;
        }

        .icon img {
            width: 48px;
            image-rendering: pixelated;
        }

        .window {
            position: absolute;
            top: 120px;
            left: 200px;
            width: 400px;
            background: #c0c0c0;
            border: 2px solid black;
            display: none;
        }

        .titlebar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 4px;
            font-size: 14px;
        }

        .content {
            padding: 15px;
            font-size: 14px;
        }

        .taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: #c0c0c0;
            border-top: 2px solid #000;
            display: flex;
            align-items: center;
        }

        .start {
            background: #c0c0c0;
            border: 2px solid black;
            margin: 5px;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .clock {
            margin-left: auto;
            margin-right: 10px;
            font-size: 14px;
        }

        /* Wired Window */
        #wiredWindow {
            background: #111;
            color: #0f0;
            border: 2px solid #0f0;
            top: 150px;
            left: 250px;
        }

        #wiredWindow .titlebar {
            background: linear-gradient(to right,#200,#900);
        }

        /* Shutdown Screen */
        #shutdownScreen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-direction: column;
        }
    </style>
</head>

<body>

<div class="desktop">

    <div class="icon" onclick="openWindow()">
        <img src="computer.png">
        <div>My Computer</div>
    </div>

    <div class="icon" onclick="openWindow()">
        <img src="folder.png">
        <div>My Documents</div>
    </div>

    <div class="icon" onclick="openWired()">
        <img src="wired.png">
        <div>The Wired</div>
    </div>

</div>

<!-- Normal Window -->
<div class="window" id="popup">
    <div class="titlebar">System</div>
    <div class="content">
        <p>Welcome to my digital room.</p>
        <p>Status: online</p>
    </div>
</div>

<!-- Wired Window -->
<div class="window" id="wiredWindow">
    <div class="titlebar">wired_connection.exe</div>
    <div class="content">
        <p id="glitch">connection unstable...</p>
        <p>you are already here.</p>
        <p style="opacity:0.6;">there is no outside.</p>
        <br>
        <button onclick="closeWired()">disconnect</button>
    </div>
</div>

<!-- Shutdown Screen -->
<div id="shutdownScreen">
    <p>It is now safe to turn off your computer.</p>
</div>

<div class="taskbar">
    <div class="start" onclick="shutdown()">Shut Down</div>
    <div class="clock" id="clock"></div>
</div>

<script>
function openWindow() {
    document.getElementById("popup").style.display = "block";
}

function openWired() {
    document.getElementById("wiredWindow").style.display = "block";
}

function closeWired() {
    document.getElementById("wiredWindow").style.display = "none";
}

function shutdown() {
    document.body.innerHTML = '';
    document.getElementById("shutdownScreen").style.display = "flex";
}

function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
        now.getHours() + ":" +
        String(now.getMinutes()).padStart(2, '0');
}

setInterval(updateClock, 1000);
updateClock();

setInterval(() => {
    const text = document.getElementById("glitch");
    if (text) {
        text.style.opacity = Math.random();
    }
}, 200);
</script>

</body>
</html>
