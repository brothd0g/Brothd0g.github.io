<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro TV Desktop ARG</title>
<style>
body {
  margin: 0;
  background: #000;
  font-family: "Tahoma", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* TV Container */
#tvContainer {
  position: relative;
  width: 900px;
  height: 700px;
}

/* TV Screen */
#tvScreen {
  position: absolute;
  top: 60px;
  left: 60px;
  width: 780px;
  height: 580px;
  overflow: hidden;
  background: url('bliss.jpg') no-repeat center center;
  background-size: cover;
}

/* TV Frame */
#tvFrame {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10000;
  pointer-events: none;
}

/* Scanlines */
.scanlines {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.08) 0px,
    rgba(0,0,0,0.08) 2px,
    transparent 2px,
    transparent 4px
  );
  z-index: 999;
}

/* Desktop icons */
.desktop {
  display: flex;
  flex-direction: column;
  width: 100px;
  padding: 10px;
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1;
}
.icon {
  width: 80px;
  text-align: center;
  color: white;
  cursor: pointer;
  margin: 15px 0;
}
.icon img {
  width: 48px;
  image-rendering: pixelated;
}

/* Windows */
.window {
  position: absolute;
  width: 400px;
  background: #c0c0c0;
  border: 2px solid black;
  display: none;
  box-shadow: 4px 4px 0 #000;
}
.titlebar {
  background: linear-gradient(to right, #000080, #1084d0);
  color: white;
  padding: 4px;
  font-size: 14px;
  cursor: move;
  display: flex;
  justify-content: space-between;
}
.window button {
  margin-left: 5px;
  background: #c0c0c0;
  border: 1px solid black;
  cursor: pointer;
}
.content {
  padding: 15px;
  font-size: 14px;
}

/* Taskbar */
.taskbar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 35px;
  background: #c0c0c0;
  border-top: 2px solid #000;
  display: flex;
  align-items: center;
  z-index: 500;
}
.start {
  background: #c0c0c0;
  border: 2px solid black;
  margin: 2px;
  padding: 3px 8px;
  font-weight: bold;
  cursor: pointer;
  z-index: 501;
}
.clock {
  margin-left: auto;
  margin-right: 5px;
  font-size: 12px;
}

/* Wired Window */
#wiredWindow {
  background: #111;
  color: #0f0;
  border: 2px solid #0f0;
}
#wiredWindow .titlebar { background: linear-gradient(to right,#200,#900); }

/* Music Player Window */
#musicWindow {
  background: #222;
  color: #0f0;
  border: 2px solid #0f0;
  font-family: "Courier New", monospace;
}
#musicWindow button {
  background: #555;
  color: white;
  border: 1px solid #0f0;
}

/* Shed Album */
#shedAlbum {
  background: #222;
  color: #0f0;
  border: 2px solid #0f0;
  font-family: "Courier New", monospace;
  text-align: center;
  transition: opacity 0.1s;
}
#shedAlbum img {
  width: 200px;
  margin-bottom: 10px;
  animation: pulse 2s infinite;
  border: 2px solid #0f0;
  box-shadow: 0 0 10px #0f0;
}
@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 10px #0f0; }
  50% { transform: scale(1.05); box-shadow: 0 0 20px #0f0; }
  100% { transform: scale(1); box-shadow: 0 0 10px #0f0; }
}
#shedTracklist { list-style:none; padding:0; }
#shedTracklist li { margin:5px 0; cursor:pointer; transition: color 0.2s, transform 0.2s; }
#shedTracklist li:hover { color: #ff0; transform: scale(1.05); }
#shedTracklist li.current { color: #0ff; font-weight:bold; }

/* Secret Page */
#secretPage {
  position: absolute;
  width: 100%;
  height: 100%;
  background: black;
  color: #0f0;
  display: none;
  justify-content: center;
  align-items: center;
  font-family: 'Courier New', monospace;
  font-size: 36px;
  text-align: center;
  z-index: 20000;
  overflow: hidden;
}

/* Shutdown Screen */
#shutdownScreen {
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  color: white;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-direction: column;
  z-index: 10000;
}
#powerOn {
  background: red;
  border: none;
  padding: 10px 20px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}

/* Hidden ARG file */
#hiddenFile { display:none; margin-top:10px; cursor:pointer; color:#0f0; text-decoration: underline; }

</style>
</head>
<body>

    <!-- Desktop Icons -->
    <div class="desktop">

      </div>
      <div class="icon" id="iconWired" onclick="openWindow('wiredWindow')">

      </div>
      <div class="icon" onclick="openWindow('musicWindow')">
        <img src="music.png"><div>Music Player</div>
      </div>
      <div class="icon" id="iconShed" onclick="openWindow('shedAlbum')">
        <img src="shed_icon.png"><div>Shed Album</div>
      </div>
    </div>

    <!-- Windows (example: popup, docsWindow, wiredWindow, musicWindow, shedAlbum, secretARG, secretPage, shutdownScreen) -->

    <div class="taskbar">
      <div class="start" onclick="shutdown()">Shut Down</div>
      <div class="clock" id="clock"></div>
    </div>

  </div>

  <img id="tvFrame" src="tv_frame.png">

</div>

</html>
