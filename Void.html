<!DOCTYPE html>
<html>
<head>
<title>void</title>
<style>
body {
  margin:0;
  background:black;
  color:#0f0;
  font-family: "Courier New", monospace;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

#text {
  font-size:24px;
  text-align:center;
  animation: flicker 0.1s infinite alternate;
}

@keyframes flicker {
  from { opacity:0.8; }
  to { opacity:1; }
}
</style>
</head>
<body>

<div id="text">
  connection established.<br><br>
  you opened the door.
</div>

<script>
setTimeout(()=>{
  document.getElementById("text").innerHTML =
    "there is no desktop.<br><br>only layers.";
},5000);

setTimeout(()=>{
  window.location.href = "index.html";
},10000);
</script>

</body>
</html>
